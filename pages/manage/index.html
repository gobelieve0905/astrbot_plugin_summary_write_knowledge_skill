<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>团队知识与技能</title><style>
body{margin:0;background:#f4f6f8;color:#243247;font:15px/1.65 system-ui}main{max-width:1100px;margin:auto;padding:28px}header,.filters,.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}header{justify-content:space-between}h1{margin:0}p{margin:8px 0}input,select,button,textarea{font:inherit;padding:8px 12px;border:1px solid #cbd5df;border-radius:7px;background:white;color:inherit;max-width:100%;box-sizing:border-box}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #77c2af}button.primary{background:#226d5b;color:white}.filters{margin:22px 0}article{background:white;border:1px solid #dce3ea;border-radius:12px;padding:22px;margin:16px 0}h2{font-size:19px;margin:0 0 6px}.tag{background:#edf3f8;padding:3px 8px;border-radius:5px;margin-right:8px;display:inline-block}small{color:#566579}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:360px;overflow:auto;background:#f4f6f8;padding:12px}label{display:flex;flex-direction:column;gap:4px}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:14px 0}#notice{color:#895326}summary{cursor:pointer;font-weight:600}.empty{padding:40px;background:white;border-radius:12px}button:disabled{opacity:.5;cursor:wait}
</style></head><body><main><header><h1>团队知识与技能</h1><button id="refresh">刷新</button></header><p>成员在聊天中创建和安装 Skill；这里统一管理分组、共享范围、版本及反馈。</p><p>个人：仅本人和维护者；项目：已有项目访问范围；团队：同一平台实例及机器人内的已启用会话。分类不会自动授予项目数据或工具权限。</p><section class="filters"><input id="query" aria-label="搜索技能" placeholder="搜索名称、描述或作者"><select id="category" aria-label="分类"></select><select id="platform" aria-label="平台"></select><select id="project" aria-label="项目"></select><select id="sharing" aria-label="共享范围"><option value="">全部共享范围</option><option value="personal">个人</option><option value="project">项目</option><option value="team">团队</option></select><select id="active" aria-label="启用状态"><option value="">全部状态</option><option value="1">已启用</option><option value="0">已停用</option></select></section><p id="notice" role="status"></p><section id="skills"></section></main><script src="./app.js"></script></body></html>
